name: Build and push images to Harbor

# Builds run on GitHub-hosted runners (real x86_64 hardware) specifically to
# avoid the cross-build platform-variant mismatches that come from building
# linux/amd64 images on ARM (e.g. Colima on Apple Silicon) -- a build that
# looks fine locally can still fail to pull on a host expecting a specific
# microarchitecture level (linux/amd64/v3) if it was cross-compiled.

on:
  push:
    branches: [ordnung]
    paths:
      - "backend/**"
      - "frontend/**"
      - "whatsapp-sidecar/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: harbor.ordnung.io/all/pingcrm-backend
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: harbor.ordnung.io/all/pingcrm-frontend
          - service: whatsapp-sidecar
            context: ./whatsapp-sidecar
            dockerfile: ./whatsapp-sidecar/Dockerfile
            image: harbor.ordnung.io/all/pingcrm-whatsapp-sidecar
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.ordnung.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Plain single-platform manifest, no attestation/SBOM manifest list --
          # some Docker Engine versions match multi-entry manifest lists against
          # a specific CPU microarchitecture variant (linux/amd64/v3) rather
          # than falling back to the generic linux/amd64 entry, and reject the
          # pull if there's no exact match.
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
