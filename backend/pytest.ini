[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    eval: golden LLM eval tests; run with `-m eval` (real provider when a key is present)
# Run tests in parallel across CPU cores. Each xdist worker gets its own database
# (see tests/conftest.py) so tests stay isolated. Override with `-n0` to run serially
# when debugging (e.g. for pdb or `-s`).
addopts = -n auto
